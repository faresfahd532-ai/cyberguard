<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CyberGuard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #050816;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #0b1024;

            padding: 40px;

            border-radius: 18px;

            border: 1px solid rgba(0, 229, 255, 0.2);

            box-shadow:
                0 0 40px rgba(0, 229, 255, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: bold;

            color: #00e5ff;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #9ca3af;

            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #d1d5db;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;

            background: #050816;

            border: 1px solid #26304d;

            border-radius: 9px;

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #00e5ff;

            box-shadow:
                0 0 0 3px rgba(0, 229, 255, 0.08);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 9px;

            background: #00e5ff;

            color: #050816;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(0, 229, 255, 0.2);
        }

        .signup-text {
            text-align: center;

            margin-top: 25px;

            color: #9ca3af;
        }

        .signup-text a {
            color: #00e5ff;

            text-decoration: none;

            font-weight: bold;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #6b7280;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            🛡️ CyberGuard
        </div>

        <p class="subtitle">
            Welcome back, security learner.
        </p>

        <form>

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Create one</a>
        </p>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

<script>
const form = document.querySelector("form");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.querySelector('input[type="email"]').value;
    const password = document.querySelector('input[type="password"]').value;

    try {
        const response = await fetch(
            "http://localhost:5000/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem("token", data.token);

            alert("Login successful! 🎉");

            window.location.href = "dashboard.html";
        } else {
            alert(data.message);
        }

    } catch (error) {
        console.error(error);
        alert("Could not connect to the server.");
    }
});
</script>

</body>
</html>
