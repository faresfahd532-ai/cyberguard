<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberGuard | Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #0f172a;
            color: white;
        }

        .navbar {
            height: 70px;
            padding: 0 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #111827;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back {
            color: #cbd5e1;
            text-decoration: none;
            transition: 0.3s;
        }

        .back:hover {
            color: #38bdf8;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .profile-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
        }

        .profile-header {
            text-align: center;
            padding-bottom: 35px;
            border-bottom: 1px solid #334155;
        }

        .avatar {
            width: 100px;
            height: 100px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #0f172a;
            border: 3px solid #38bdf8;

            font-size: 45px;
        }

        .profile-header h1 {
            margin-bottom: 8px;
        }

        .profile-header p {
            color: #94a3b8;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .info-box {
            padding: 22px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .info-box small {
            display: block;
            color: #64748b;
            margin-bottom: 8px;
        }

        .info-box strong {
            font-size: 17px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat {
            text-align: center;
            padding: 25px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat h2 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .stat p {
            color: #94a3b8;
        }

        .logout {
            width: 100%;
            margin-top: 30px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #ef4444;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        .logout:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 700px) {

            .info,
            .stats {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 20px;
            }

            .profile-card {
                padding: 25px;
            }
        }
.nav-links {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logout {
    background: transparent;
    color: white;
    border: 1px solid #334155;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s ease;
}

.logout:hover {
    background: #ef4444;
    border-color: #ef4444;
}

    </style>
</head>

<body>

   <nav class="navbar">

    <div class="logo">
        🛡️ CyberGuard
    </div>

    <div class="nav-links">

        <a href="dashboard.html" class="back">
            ← Dashboard
        </a>

        <button onclick="logout()" class="logout">
            Logout
        </button>

    </div>

</nav>

    <main class="container">

       <div class="profile-card">

    <div class="profile-header">

        <div class="avatar">
            👤
        </div>

        <div class="profile-title">
            <h1 id="username">
                Loading...
            </h1>

            <p id="email">
                Loading...
            </p>
        </div>

        <div class="status">
            <span></span>
            Active
        </div>

    </div>


    <div class="divider"></div>


    <div class="info">

        <div class="info-box">

            <span class="info-icon">👤</span>

            <div>
                <small>Username</small>

                <strong id="usernameInfo">
                    Loading...
                </strong>
            </div>

        </div>


        <div class="info-box">

            <span class="info-icon">📧</span>

            <div>
                <small>Email Address</small>

                <strong id="emailInfo">
                    Loading...
                </strong>
            </div>

        </div>

    </div>


    <div class="divider"></div>


    <h2 class="section-title">
        Your Progress
    </h2>


    <div class="stats">

        <div class="stat">

            <div class="stat-icon">
                🎯
            </div>

            <h2>0</h2>

            <p>Quizzes</p>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ⚔️
            </div>

            <h2>0</h2>

            <p>Challenges</p>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🏆
            </div>

            <h2>0</h2>

            <p>Badges</p>

        </div>

    </div>

    <div class="stat">

    <div class="stat-icon">
        ⭐
    </div>

    <h2 id="totalScore">
        0
    </h2>

    <p>Total Score</p>

</div>

</div>


            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>

    </main>


    <script>

        const token = localStorage.getItem("token");

        if (!token) {

            window.location.href = "login.html";

        }


       async function loadProfile() {

    try {

        const response = await fetch(
            "http://localhost:5000/api/profile",
            {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {

            localStorage.removeItem("token");

            window.location.href = "login.html";

            return;

        }


        // User Information

        document.getElementById("username").textContent =
            data.user.username;

        document.getElementById("email").textContent =
            data.user.email;

        document.getElementById("usernameInfo").textContent =
            data.user.username;

        document.getElementById("emailInfo").textContent =
            data.user.email;


        // Quiz Statistics

        const quizCount =
            data.stats?.quizCount || 0;

        document.querySelector(".stat:nth-child(1) h2").textContent =
            quizCount;

            const totalScore =
    data.stats?.totalScore || 0;

document.getElementById("totalScore").textContent =
    totalScore;

    } catch (error) {

        console.error(error);

    }

}


        loadProfile();


        function logout() {

            localStorage.removeItem("token");

            window.location.href = "login.html";

        }

    </script>

</body>

</html>
